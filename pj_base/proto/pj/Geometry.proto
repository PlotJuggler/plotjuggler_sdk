// PlotJuggler canonical geometry protobuf schemas.
// Field layout adapted from Foxglove SDK schemas (MIT License,
// Copyright (c) Foxglove Technologies Inc).

syntax = "proto3";

package PJ;

// Spatial conventions for every PJ message that uses the types in this file.
//
// - Positions and lengths are in metres. A field in another unit says so: image annotations are in pixels, a depth
//   image names its unit in `encoding`, and some scene sizes are in screen pixels when `scale_invariant` is set.
//   Scale factors and ratios have no unit.
// - Coordinate frames are right-handed. What the axes mean belongs to the frame named by `frame_id`; this schema fixes
//   no "forward" or "up".
// - A Quaternion is a rotation written (x, y, z, w), with w the scalar part (Hamilton convention). It rotates a vector
//   as v' = q * v * conjugate(q), so a positive angle turns counter-clockwise when seen from the tip of the axis. It
//   must have unit length. All four components at zero is not a rotation: it is what a producer writes when it leaves
//   the orientation unset, and it is read as the identity.
// - A Pose places an object in its frame: p_frame = R(orientation) * p_local + position.
// - A FrameTransform places a child frame in its parent: p_parent = R(rotation) * p_child + translation.

// A point representing a position in 2D space
message Point2 {
  // x coordinate position
  double x = 1;

  // y coordinate position
  double y = 2;
}

// A point representing a position in 3D space
message Point3 {
  // x coordinate position
  double x = 1;

  // y coordinate position
  double y = 2;

  // z coordinate position
  double z = 3;
}

// A vector in 2D space that represents a direction only
message Vector2 {
  // x component
  double x = 1;

  // y component
  double y = 2;
}

// A vector in 3D space that represents a direction only
message Vector3 {
  // x component
  double x = 1;

  // y component
  double y = 2;

  // z component
  double z = 3;
}

// A unit quaternion representing a rotation in 3D space; see the conventions at the top of this file
message Quaternion {
  // x value
  double x = 1;

  // y value
  double y = 2;

  // z value
  double z = 3;

  // w value (the scalar part)
  double w = 4;
}

// A pose in 3D space consisting of position (translation) and orientation (rotation)
message Pose {
  // Position of the pose's origin in the parent frame
  PJ.Vector3 position = 1;

  // Orientation of the pose relative to the parent frame's axes
  PJ.Quaternion orientation = 2;
}
