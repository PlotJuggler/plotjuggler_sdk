// PlotJuggler canonical channel-mesh protobuf schema.
// Wire-level contract for the byte-backed `MeshMap` builtin
// (SDK struct lives in pj_base/include/pj_base/builtin/mesh_map.hpp).

syntax = "proto3";

import "pj/Geometry.proto";
import "pj/PointCloud.proto";
import "google/protobuf/timestamp.proto";

package PJ;

// A connection between two faces that do not share an edge (stairs, ramp,
// elevator, door, an off-mesh connection).
message MeshFaceLink {
  uint32 from_face = 1;
  uint32 to_face = 2;

  // Producer-defined category; viewers may colour by it
  uint32 kind = 3;

  bool bidirectional = 4;
}

// A triangle mesh whose vertices and faces carry named channels — the mesh
// sibling of GridMap: navigation meshes, traversability / cost meshes,
// semantic surface maps.
//
// Vertices and faces are fixed-size records described by PJ.PointField, both
// in `data`: vertex v at `v * vertex_stride`, face f at
// `face_data_offset + f * face_stride`. Required channels: `x`, `y`, `z`
// (float32 or float64, count 1) when there are vertices; `vertex_indices`
// (uint32, count 3) when there are faces, each index below `vertex_count`.
// Every other field is a channel; a NaN in a float channel means "no data".
// Which channel colours the mesh and the colormap are viewer-side.
//
// Vertices are in the local frame of `origin`, itself in `frame_id`.
// `geometry_id` names the geometry revision ("" = unspecified); a
// PJ.MeshMapUpdate applies only to the mesh with the same id.
//
// On the SDK side `data` is exposed as `Span<const uint8_t>` plus a
// `BufferAnchor`; the anchor is a C++ lifetime concept with no wire equivalent.
message MeshMap {
  // Timestamp of the mesh
  google.protobuf.Timestamp timestamp = 1;

  // Source coordinate frame (3D consumers TF-transform from this frame to a fixed render frame)
  string frame_id = 2;

  // Pose of the mesh's local frame in `frame_id`
  PJ.Pose origin = 3;

  // Geometry revision; "" = unspecified
  string geometry_id = 4;

  // Number of vertex records
  uint32 vertex_count = 5;

  // Bytes per vertex record (>= the largest vertex field end)
  uint32 vertex_stride = 6;

  // Channel layout of a vertex record
  repeated PJ.PointField vertex_fields = 7;

  // Number of face (triangle) records
  uint32 face_count = 8;

  // Bytes per face record (>= the largest face field end)
  uint32 face_stride = 9;

  // Byte offset of face 0 in `data` (>= vertex_count * vertex_stride)
  uint64 face_data_offset = 10;

  // Channel layout of a face record
  repeated PJ.PointField face_fields = 11;

  // Links between faces that do not share an edge
  repeated MeshFaceLink links = 12;

  // Vertex records, then face records from `face_data_offset`
  bytes data = 13;
}
