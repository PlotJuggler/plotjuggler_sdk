// PlotJuggler canonical channel-mesh protobuf schema.
// Wire-level contract for the byte-backed `MeshMap` builtin
// (SDK struct lives in pj_base/include/pj_base/builtin/mesh_map.hpp).

syntax = "proto3";

import "pj/ChannelInfo.proto";
import "pj/Geometry.proto";
import "pj/PointCloud.proto";
import "google/protobuf/timestamp.proto";

package PJ;

// One data array of a mesh: a value (or a `count`-component vector) per vertex
// or per face, tightly packed in element order: element e, component c at byte
// (e * count + c) * element size, each element little-endian with the native
// size of `datatype`. `data` holds exactly element_count * count elements, the
// element count being the mesh's vertex or face count (or, in a
// MeshChannelPatch, its index count). Conventional names: red, green, blue,
// alpha (uint8 vertex colour), normal (count 3), uv (count 2).
message MeshChannel {
  enum Target {
    VERTEX = 0;
    FACE = 1;
  }

  string name = 1;
  Target target = 2;
  PJ.PointField.Datatype datatype = 3;

  // Components per element
  uint32 count = 4;

  bytes data = 5;
  PJ.ChannelInfo info = 6;
}

// A connection between two faces that do not share an edge (stairs, ramp,
// elevator, door, an off-mesh connection).
message MeshFaceLink {
  uint32 from_face = 1;
  uint32 to_face = 2;

  // Producer-defined category; viewers may colour by it
  uint32 kind = 3;

  bool bidirectional = 4;

  // Travel cost or length; absent = unspecified
  optional double cost = 5;
}

// A triangle mesh whose vertices and faces carry named data channels — the mesh
// sibling of GridMap: navigation meshes, traversability / cost meshes, semantic
// surface maps.
//
// Geometry: `positions` holds vertex_count interleaved x, y, z of
// `position_type` (FLOAT32 or FLOAT64, little-endian) in the local frame of
// `origin`, itself in `frame_id`; `indices` holds face_count triplets of raw
// little-endian uint32 (4 bytes each, three per face), each below vertex_count. Data lives in `channels`, one array per
// channel; (target, name) pairs are unique. Which channel colours the mesh is viewer-side.
//
// `geometry_id` names the geometry revision ("" = unspecified); a
// PJ.MeshMapUpdate applies only to the mesh with the same id. `id` names the
// mesh within its topic ("" = the topic's only mesh); reserved for topics that
// carry several meshes replaced by id.
//
// Decoders skip unknown fields, so optional fields may be added later, and drop
// a channel whose `target` or `datatype` number they do not know, so either
// enum may grow.
message MeshMap {
  google.protobuf.Timestamp timestamp = 1;

  // Source coordinate frame (3D consumers TF-transform from it to a fixed render frame)
  string frame_id = 2;

  // Pose of the mesh's local frame in `frame_id`
  PJ.Pose origin = 3;

  string id = 4;
  string geometry_id = 5;

  uint32 vertex_count = 6;
  PJ.PointField.Datatype position_type = 7;
  bytes positions = 8;

  uint32 face_count = 9;
  bytes indices = 10;

  repeated MeshChannel channels = 11;
  repeated MeshFaceLink links = 12;
}
