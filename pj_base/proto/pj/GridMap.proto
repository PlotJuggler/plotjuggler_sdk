// PlotJuggler canonical 2D grid-map protobuf schema.
// Wire-level contract for the byte-backed `GridMap` builtin
// (SDK struct lives in pj_base/include/pj_base/builtin/grid_map.hpp).

syntax = "proto3";

import "pj/Geometry.proto";
import "pj/PointCloud.proto";
import "google/protobuf/timestamp.proto";

package PJ;

// A 2D grid whose cells carry named channels — the layered, generic-valued
// sibling of OccupancyGrid: elevation maps, multi-layer costmaps, terrain
// classification. The packed cell layout is the one foxglove.Grid uses, so a
// parser can expose that message's `data` as a zero-copy view; the header and
// field descriptors are converted (this message has its own field numbers and
// an explicit row_count, and PJ.PointField's datatype numbering differs from
// PackedElementField's).
//
// Cells are fixed-size records of `cell_stride` bytes in row-major order
// (x / column varies fastest), `row_stride` bytes per row; the byte offset of
// cell (c, r) is `r*row_stride + c*cell_stride` and `data.size()` must be at
// least `row_count * row_stride`. `fields` describes the channels inside one
// record; a NaN in a float channel means "no data" for that cell.
//
// Cell (c, r) center is at `origin ∘ ((c+.5)*cell_size.x, (r+.5)*cell_size.y, 0)`
// in `frame_id`, where `origin` is the corner of cell (0,0) and the grid lies
// in the origin's local xy-plane. Which channel is height, which is color and
// the colormap are viewer-side. Conventional channel names: `elevation` for
// height; `red`, `green`, `blue`, `alpha` for RGBA color.
//
// On the SDK side `data` is exposed as `Span<const uint8_t>` plus a
// `BufferAnchor`; the anchor is a C++ lifetime concept with no wire equivalent.
message GridMap {
  // Timestamp of the grid
  google.protobuf.Timestamp timestamp = 1;

  // Source coordinate frame for the grid (3D consumers TF-transform from this frame to a fixed render frame)
  string frame_id = 2;

  // Pose of the corner of cell (0,0) in `frame_id`; the grid lies in the pose's local xy-plane
  PJ.Pose origin = 3;

  // Metric cell size along the local x (columns) and y (rows) axes, meters
  PJ.Vector2 cell_size = 4;

  // Number of cells along the local x axis (fastest-varying)
  uint32 column_count = 5;

  // Number of cells along the local y axis
  uint32 row_count = 6;

  // Bytes per cell record (>= the largest field end: offset + element size * count)
  uint32 cell_stride = 7;

  // Bytes per row (>= column_count * cell_stride)
  uint32 row_stride = 8;

  // Channel layout for each cell record in `data`
  repeated PJ.PointField fields = 9;

  // Packed cell records in row-major order
  bytes data = 10;
}
