syntax = "proto3";

import "google/protobuf/timestamp.proto";

package PJ;

// Raw robot-model document plus the information needed to route and place it.
message RobotDescription {
  google.protobuf.Timestamp timestamp = 1;
  string topic = 2;
  string format = 3;
  string text = 4;
}
